# Chapter 26 sandbox: a single Postgres 17 node and a dedicated
# pgBackRest container, with the backup repository on a local volume.
# The same configuration translates to S3 with three changes
# (repo1-type=s3, an access key, and a bucket name).
#
#   docker compose up -d
#
# Wait ~10 seconds for Postgres to bootstrap, then run the seed script:
#
#   docker exec -it cinetrack-pg-26 psql -U postgres -d cinetrack \
#       -f /docker-entrypoint-initdb.d/seed.sql
#
# Then follow pitr-walkthrough.md to take a backup, run a destructive
# DELETE, and recover to one second before the mistake.

services:
  postgres:
    image: postgres:17-bookworm
    container_name: cinetrack-pg-26
    hostname: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinetrack
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=cinetrack archive-push %p
      - -c
      - archive_timeout=60
      - -c
      - max_wal_senders=10
      - -c
      - log_min_messages=info
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pgbackrest_repo:/var/lib/pgbackrest
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    # The Postgres image needs pgBackRest installed so archive_command
    # works. The init script below installs it on first start.
    entrypoint:
      - /bin/bash
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq pgbackrest >/dev/null
        mkdir -p /var/log/pgbackrest /var/lib/pgbackrest
        chown -R postgres:postgres /var/log/pgbackrest /var/lib/pgbackrest
        exec docker-entrypoint.sh "$$@"
      - --
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinetrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The pgBackRest container is a tools-only sidecar. It mounts the same
  # repository volume as Postgres and runs `pgbackrest backup` /
  # `pgbackrest restore` / `pgbackrest info` from a separate process
  # space. In production this would be a dedicated backup host.
  pgbackrest:
    image: postgres:17-bookworm
    container_name: cinetrack-pgbackrest-26
    hostname: pgbackrest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - pgbackrest_repo:/var/lib/pgbackrest
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq pgbackrest >/dev/null
        mkdir -p /var/log/pgbackrest /var/lib/pgbackrest
        chown -R postgres:postgres /var/log/pgbackrest /var/lib/pgbackrest
        # Keep the container alive so the operator can `docker exec` into it.
        tail -f /dev/null

volumes:
  pg_data:
  pgbackrest_repo:
