# pgBackRest configuration for the cinetrack chapter-26 sandbox. One
# stanza, one local repository on a Docker volume. For production:
# change repo1-type to s3, add repo1-s3-bucket / repo1-s3-region /
# repo1-s3-endpoint, and ship the access key via instance profile or
# environment variable.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=4
repo1-bundle=y
repo1-block=y

# Issue an immediate checkpoint at backup start instead of waiting for
# the next scheduled one. Removes a few minutes of latency from each
# backup.
start-fast=y

# Compress every file before writing to the repo. zstd is the modern
# default; cheap to compress, cheap to decompress, smaller than gzip.
compress-type=zst
compress-level=3

# Parallelism. 2 workers is fine for the sandbox; production should
# match the host's CPU count.
process-max=2

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[cinetrack]
pg1-port=5432
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
pg1-database=cinetrack
