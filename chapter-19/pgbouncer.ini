; Chapter 19 pgbouncer configuration.
; Transaction-pool mode plus protocol-level prepared-statement support.
; This is the shape of a production pgbouncer config for a single Postgres.
;
; NOTE: the docker-compose sandbox uses the edoburu/pgbouncer image, which
; generates its own pgbouncer.ini from environment variables at startup and
; does NOT honor this mounted file. Treat this file as the reference shape of
; a production INI. The compose envs (POOL_MODE, AUTH_TYPE, DEFAULT_POOL_SIZE,
; MAX_PREPARED_STATEMENTS, etc.) drive the running pooler. Switch to the
; bitnami or cybertec pgbouncer image if you want this INI to be authoritative.

[databases]
cinetrack = host=postgres port=5432 dbname=cinetrack

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication. In production use scram-sha-256 with a SCRAM secret in
; userlist.txt of the form:  "user" "SCRAM-SHA-256$<iter>$<salt>:<stored>"
; (copy the rolpassword value from pg_authid). For the sandbox we use md5 so
; the simple plaintext password in userlist.txt is accepted and the chapter
; boots with no extra setup.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; The pool mode that owns this chapter. Transaction is the right default.
pool_mode = transaction

; Cheap client connections in front of the small backend pool.
max_client_conn = 2000

; Real Postgres backends per (database, user) pair.
; Sized for an 8-core dev box: roughly (2 * cores) + spindles.
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 5

; Protocol-level prepared statement support (pgbouncer 1.21+).
; Without this, PgJDBC and friends break in transaction mode.
max_prepared_statements = 256

; Connection lifecycle on the server side.
server_lifetime = 3600
server_idle_timeout = 600
server_check_query = SELECT 1
server_check_delay = 30

; Client-side timeouts. Fail fast when the pool is exhausted.
query_wait_timeout = 30
client_idle_timeout = 0

; Admin console settings.
admin_users = cinetrack
stats_users = cinetrack

; Logging. Useful while learning; trim in production if log volume matters.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0
