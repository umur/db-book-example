# HAProxy in front of the three-node Patroni cluster.
#
# Two backends:
#   postgres-primary  -> port 5432, routed to whichever node answers 200
#                        on the Patroni REST /leader endpoint.
#   postgres-replica  -> port 5433, routed to nodes answering 200 on
#                        /replica.
#
# The application connects to host port 5432 for read-write traffic and
# 5433 for read-only. Both DSNs survive every failover; HAProxy redirects
# within a second of the new primary completing promotion.

global
    maxconn 200

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 5s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen postgres-primary
    bind *:5432
    option httpchk GET /leader
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-1 pg-1:5432 maxconn 100 check port 8008
    server pg-2 pg-2:5432 maxconn 100 check port 8008
    server pg-3 pg-3:5432 maxconn 100 check port 8008

listen postgres-replica
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-1 pg-1:5432 maxconn 100 check port 8008
    server pg-2 pg-2:5432 maxconn 100 check port 8008
    server pg-3 pg-3:5432 maxconn 100 check port 8008
