# Chapter 25 sandbox: a three-node Patroni cluster on a three-node etcd
# cluster. Brings up six containers; the Postgres nodes run Patroni and
# Postgres 17 inside the same image, the etcd nodes run a stock etcd 3.5
# build with TLS disabled (for the sandbox; do not copy this for prod).
#
#   docker compose up -d
#
# Wait ~20 seconds for etcd quorum and Patroni bootstrap, then:
#
#   docker exec -it patroni-pg-1 patronictl -c /home/postgres/postgres.yml list
#
# The Patroni REST API is exposed on host ports 8001/8002/8003 for
# pg-1/pg-2/pg-3 respectively. Postgres is reachable through the HAProxy
# container on host port 5432 (read-write) and 5433 (read-only).
#
# To force a failover, see failover-tour.md.

x-patroni-base: &patroni-base
  image: ghcr.io/zalando/spilo-17:4.0-p1
  environment:
    ETCD3_HOSTS: '"etcd-1:2379","etcd-2:2379","etcd-3:2379"'
    SCOPE: cinetrack
    PGUSER_SUPERUSER: postgres
    PGPASSWORD_SUPERUSER: postgres
    PGUSER_ADMIN: cinetrack
    PGPASSWORD_ADMIN: cinetrack
    PGUSER_STANDBY: replicator
    PGPASSWORD_STANDBY: replicator
  volumes:
    - ./patroni.yml.template:/home/postgres/patroni.yml.template:ro
    - ./init.sql:/home/postgres/init.sql:ro
    - ./seed.sql:/home/postgres/seed.sql:ro
  cap_add:
    - SYS_RESOURCE  # for setting resource limits Spilo expects

services:
  etcd-1:
    image: gcr.io/etcd-development/etcd:v3.5.13
    container_name: cinetrack-etcd-1
    command:
      - etcd
      - --name=etcd-1
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=cinetrack-etcd
    volumes:
      - etcd_1_data:/etcd-data

  etcd-2:
    image: gcr.io/etcd-development/etcd:v3.5.13
    container_name: cinetrack-etcd-2
    command:
      - etcd
      - --name=etcd-2
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=cinetrack-etcd
    volumes:
      - etcd_2_data:/etcd-data

  etcd-3:
    image: gcr.io/etcd-development/etcd:v3.5.13
    container_name: cinetrack-etcd-3
    command:
      - etcd
      - --name=etcd-3
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=cinetrack-etcd
    volumes:
      - etcd_3_data:/etcd-data

  pg-1:
    <<: *patroni-base
    container_name: patroni-pg-1
    hostname: pg-1
    environment:
      ETCD3_HOSTS: '"etcd-1:2379","etcd-2:2379","etcd-3:2379"'
      SCOPE: cinetrack
      PATRONI_NAME: pg-1
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1:5432
    ports:
      - "8001:8008"
    volumes:
      - pg_1_data:/home/postgres/pgdata
      - ./patroni.yml.template:/home/postgres/patroni.yml.template:ro
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3

  pg-2:
    <<: *patroni-base
    container_name: patroni-pg-2
    hostname: pg-2
    environment:
      ETCD3_HOSTS: '"etcd-1:2379","etcd-2:2379","etcd-3:2379"'
      SCOPE: cinetrack
      PATRONI_NAME: pg-2
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-2:5432
    ports:
      - "8002:8008"
    volumes:
      - pg_2_data:/home/postgres/pgdata
      - ./patroni.yml.template:/home/postgres/patroni.yml.template:ro
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3

  pg-3:
    <<: *patroni-base
    container_name: patroni-pg-3
    hostname: pg-3
    environment:
      ETCD3_HOSTS: '"etcd-1:2379","etcd-2:2379","etcd-3:2379"'
      SCOPE: cinetrack
      PATRONI_NAME: pg-3
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-3:5432
    ports:
      - "8003:8008"
    volumes:
      - pg_3_data:/home/postgres/pgdata
      - ./patroni.yml.template:/home/postgres/patroni.yml.template:ro
    depends_on:
      - etcd-1
      - etcd-2
      - etcd-3

  haproxy:
    image: haproxy:2.9-alpine
    container_name: cinetrack-haproxy-ch25
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"   # read-write, routed to current primary
      - "5433:5433"   # read-only, routed to healthy replicas
      - "7001:7000"   # HAProxy stats UI (host 7000 collides with macOS Control Center)
    depends_on:
      - pg-1
      - pg-2
      - pg-3

volumes:
  etcd_1_data:
  etcd_2_data:
  etcd_3_data:
  pg_1_data:
  pg_2_data:
  pg_3_data:
