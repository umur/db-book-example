# Chapter 18 sandbox: Postgres 17 with the cinetrack schema, ready to demo
# vacuum, bloat, freezing, and per-table autovacuum tuning.
#
#   docker compose up -d
#   psql -h localhost -U cinetrack -d cinetrack -f init.sql
#   psql -h localhost -U cinetrack -d cinetrack -f seed.sql
#   psql -h localhost -U cinetrack -d cinetrack -f extensions.sql
#   psql -h localhost -U cinetrack -d cinetrack -f vacuum-tour.sql
#
# The named volume keeps your data across container restarts. Drop it with
# `docker compose down -v` when you want a fresh sandbox.
#
# Note: pg_repack ships as a separate container image; the README shows how to
# point it at this database when you want to compact a bloated table.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cinetrack-pg-ch18
    environment:
      POSTGRES_USER: cinetrack
      POSTGRES_PASSWORD: cinetrack
      POSTGRES_DB: cinetrack
    ports:
      - "5432:5432"
    volumes:
      - cinetrack_pg_data_ch18:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      postgres
      -c log_autovacuum_min_duration=0
      -c log_min_messages=info
      -c maintenance_work_mem=256MB
      -c autovacuum_naptime=10s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetrack -d cinetrack"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cinetrack_pg_data_ch18:
