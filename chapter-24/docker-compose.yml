# Chapter 24 sandbox: a Postgres 15 publisher and a Postgres 17 subscriber.
# This is the upgrade scenario from subchapter 24.4 in miniature.
#
#   docker compose up -d
#   psql -h localhost -p 5415 -U cinetrack -d cinetrack -f init.sql
#   psql -h localhost -p 5415 -U cinetrack -d cinetrack -f seed.sql
#   psql -h localhost -p 5417 -U cinetrack -d cinetrack -f init.sql
#   psql -h localhost -p 5415 -U cinetrack -d cinetrack -f logical-tour.sql
#
# Port 5415 is the Postgres 15 publisher, port 5417 is the Postgres 17 subscriber.
# Both use wal_level=logical so either side can publish if you want to test
# bidirectional replication. The named volumes keep state across restarts;
# `docker compose down -v` resets both clusters.

services:
  publisher:
    image: postgres:15-alpine
    container_name: cinetrack-pg15-pub
    environment:
      POSTGRES_USER: cinetrack
      POSTGRES_PASSWORD: cinetrack
      POSTGRES_DB: cinetrack
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "log_min_messages=notice"
      - "-c"
      - "log_replication_commands=on"
    ports:
      - "5415:5432"
    volumes:
      - cinetrack_pg15_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetrack -d cinetrack"]
      interval: 5s
      timeout: 3s
      retries: 5

  subscriber:
    image: postgres:17-alpine
    container_name: cinetrack-pg17-sub
    environment:
      POSTGRES_USER: cinetrack
      POSTGRES_PASSWORD: cinetrack
      POSTGRES_DB: cinetrack
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_logical_replication_workers=8"
      - "-c"
      - "max_sync_workers_per_subscription=4"
      - "-c"
      - "log_min_messages=notice"
    ports:
      - "5417:5432"
    volumes:
      - cinetrack_pg17_data:/var/lib/postgresql/data
    depends_on:
      publisher:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetrack -d cinetrack"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cinetrack_pg15_data:
  cinetrack_pg17_data:
