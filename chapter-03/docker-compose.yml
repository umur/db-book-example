# Chapter 3 sandbox: Postgres 17 with pageinspect and pgstattuple loaded.
#
#   docker compose up -d
#   psql -h localhost -U cinetrack -d cinetrack -f seed.sql
#   psql -h localhost -U cinetrack -d cinetrack -f storage-tour.sql
#
# init.sql creates the cinetrack schema. extensions.sql loads the storage
# inspection extensions. Both run automatically the first time the container
# starts. Drop the volume with `docker compose down -v` for a fresh start.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cinetrack-pg-ch03
    environment:
      POSTGRES_USER: cinetrack
      POSTGRES_PASSWORD: cinetrack
      POSTGRES_DB: cinetrack
    ports:
      - "5432:5432"
    volumes:
      - cinetrack_pg_data_ch03:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./extensions.sql:/docker-entrypoint-initdb.d/02-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetrack -d cinetrack"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cinetrack_pg_data_ch03:
